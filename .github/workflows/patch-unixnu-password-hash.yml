name: patch-unixnu-password-hash

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Build TianoCompress and fetch scripts
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mtools
          git clone --depth 1 --filter=blob:none --sparse https://github.com/microsoft/mu_basecore.git mubt
          git -C mubt sparse-checkout set BaseTools/Source/C BaseTools/Source/Python MdePkg/Include
          make -C mubt/BaseTools/Source/C TianoCompress 2>/dev/null || make -C mubt/BaseTools/Source/C || true
          TC=$(find mubt -name TianoCompress -type f | head -1)
          [ -n "$TC" ] || { echo "::error::TianoCompress build failed"; exit 1; }
          sudo ln -sf "$(pwd)/$TC" /usr/local/bin/TianoCompress
          REF=8542980d02b4d2cc5c32ee3542de1760b2562aac
          mkdir -p unixnu
          curl -sL "https://raw.githubusercontent.com/UniXNU/UniXNU/$REF/scripts/unixnu/ramdisk.py" -o ramdisk.py
          curl -sL "https://raw.githubusercontent.com/UniXNU/UniXNU/$REF/scripts/unixnu/vendor_boot.py" -o unixnu/vendor_boot.py
          curl -sL "https://raw.githubusercontent.com/UniXNU/UniXNU/$REF/scripts/unixnu/util.py" -o unixnu/util.py
          touch unixnu/__init__.py

      - name: Download v11 vendor_boot (the one that reaches desktop)
        run: |
          curl -sL --retry 5 -o stock-vendor_boot.img \
            https://github.com/ppma/UniXNU-sheng-fork/releases/download/gki-v11/vendor_boot.img
          sha256sum stock-vendor_boot.img

      - name: Rewrite unixnu password hash in data.dbr
        run: |
          set -euxo pipefail
          python3 - <<'PYEOF'
          import os, sys, subprocess, hashlib, plistlib
          sys.path.insert(0, '.')
          import ramdisk
          from unixnu import vendor_boot

          NEW_PASSWORD = 'unixnu123'

          # 1) vendor_boot -> ramdisk -> FAT
          vb = open('stock-vendor_boot.img','rb').read()
          parts = vendor_boot.parse(vb)
          open('vb-ramdisk.bin','wb').write(parts['ramdisk'])
          ramdisk.decode('vb-ramdisk.bin', 'vb-fat.img')
          print('FAT bytes:', os.path.getsize('vb-fat.img'))

          # 2) find data.dbr in FAT (list root)
          out = subprocess.run(['mdir','-i','vb-fat.img','-/','::/'], capture_output=True, text=True).stdout
          print('FAT root:', out[:3000])
          # try common names
          dbr_name = None
          # kernel reads the Data seed from EFI/UniXNU/Payloads/scratch-data.img
          for cand in ['EFI/UniXNU/Payloads/scratch-data.img', 'scratch-data.img']:
              r = subprocess.run(['mcopy','-i','vb-fat.img','::/'+cand,'data.dbr'], capture_output=True)
              if r.returncode == 0 and os.path.exists('data.dbr'):
                  dbr_name = cand; break
          assert dbr_name, 'data seed (scratch-data.img) not found in vendor FAT'
          print('found data.dbr as:', dbr_name, 'size:', os.path.getsize('data.dbr'))
          print('magic:', open('data.dbr','rb').read(8))

          # 3) locate the inner SALTED-SHA512-PBKDF2 bplist (search whole file)
          d = bytearray(open('data.dbr','rb').read())
          found = None
          pos = 0
          while True:
              i = d.find(b'bplist00', pos)
              if i < 0: break
              for L in range(40, 0x600):
                  try:
                      o = plistlib.loads(bytes(d[i:i+L]))
                  except Exception:
                      continue
                  if isinstance(o, dict) and 'SALTED-SHA512-PBKDF2' in o:
                      found = (i, L, o); break
              if found: break
              pos = i + 1
          assert found, 'password hash bplist not found'
          off, oldlen, old = found
          p = old['SALTED-SHA512-PBKDF2']
          print('hash at 0x%x len=%d iters=%d' % (off, oldlen, p['iterations']))
          print('old salt:', p['salt'].hex()[:32])

          # 4) generate new hash with same salt/iterations (length-preserving)
          newp = dict(p)
          newp['entropy'] = hashlib.pbkdf2_hmac('sha512', NEW_PASSWORD.encode(), p['salt'], p['iterations'], 128)
          newblob = plistlib.dumps({'SALTED-SHA512-PBKDF2': newp}, fmt=plistlib.FMT_BINARY)
          assert len(newblob) == oldlen, 'length changed: %d -> %d' % (oldlen, len(newblob))
          d[off:off+oldlen] = newblob
          open('data-new.dbr','wb').write(bytes(d))
          print('new hash written, password =', NEW_PASSWORD)

          # 5) repack: data.dbr -> FAT -> vendor_boot
          subprocess.run(['mcopy','-i','vb-fat.img','-o','data-new.dbr','::/'+dbr_name], check=True)
          ramdisk.encode('vb-fat.img', 'vb-ramdisk-new.bin')
          vendor_boot.build('stock-vendor_boot.img', 'vb-ramdisk-new.bin',
                            'vendor_boot-unixnu123.img', 0x1000000)
          print('patched vendor_boot:', os.path.getsize('vendor_boot-unixnu123.img'))
          assert os.path.getsize('vendor_boot-unixnu123.img') <= 0x6000000
          print('HASH PATCH DONE')
          PYEOF

      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          sha256sum vendor_boot-unixnu123.img
          gh release view gki-v11-unixnu123 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release delete gki-v11-unixnu123 --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create gki-v11-unixnu123 vendor_boot-unixnu123.img --repo "$GITHUB_REPOSITORY" \
            --title "v11 vendor_boot with unixnu password = unixnu123" \
            --notes "Rewrites the SALTED-SHA512-PBKDF2 hash in data.dbr's unixnu.plist (length-preserving in-place). Flash vendor_boot_a only. Login: unixnu / unixnu123"
