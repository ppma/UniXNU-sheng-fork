name: patch-vendor-boot-datareset

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download latest build cache and locate BootResetCore.h
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -sL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/caches/11112188546/zip" \
            -o cache.zip
          ls -la cache.zip
          mkdir -p unpacked
          cd unpacked
          unzip -q ../cache.zip || true
          echo "=== BootResetCore locations ==="
          find . -iname '*bootreset*' -o -iname '*BootReset*' | head -20
          echo "=== all BootResetCore.h contents ==="
          for f in $(find . -iname 'BootResetCore.h'); do
            echo "----- $f -----"
            cat "$f"
          done
          echo "=== ShengBootGuard include dir listing ==="
          find . -path '*shengPkg/Include*' -type f | head -20
          echo "=== Binaries dirs ==="
          find . -maxdepth 4 -type d -name 'Binaries' | head -5

      - name: Publish BootResetCore.h to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          cd unpacked
          F=$(find . -iname 'BootResetCore.h' | head -1)
          if [ -n "$F" ]; then
            gh release view gki-tools --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release delete gki-tools --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
            gh release create gki-tools "$F" --repo "$GITHUB_REPOSITORY" --title "firmware headers" --notes "BootResetCore.h extracted from the build cache"
            gh release view gki-tools --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | .name'
          else
            echo "::error::BootResetCore.h not found in cache"
            exit 1
          fi
