name: publish-artifact-to-release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run id that produced the artifact'
        required: true
      artifact_id:
        description: 'Artifact database id (from API artifacts list)'
        required: true
      artifact:
        description: 'Artifact name'
        required: true
        default: 'sheng-boot-only'
      tag:
        description: 'Release tag to create'
        required: true
        default: 'gki-v9-build'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download artifact via API (GitHub-internal transfer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -sL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/${{ github.event.inputs.artifact_id }}/zip" \
            -o "${{ github.event.inputs.artifact }}.zip"
          ls -la
          unzip -q -o "${{ github.event.inputs.artifact }}.zip"
          rm -f "${{ github.event.inputs.artifact }}.zip"
          echo "=== unpacked ==="
          find . -maxdepth 2 -type f -printf '%s  %p\n' | sort -nr

      - name: Repack single flash bundle zip
        # The release carries one combined zip (boot.img + vendor_boot.img),
        # matching the original artifact concept: one package to download,
        # two partitions to flash (boot_a + vendor_boot_a).
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('sheng-boot-only.zip', 'w', zipfile.ZIP_STORED) as z:
              for f in ('boot.img', 'vendor_boot.img'):
                  z.write(f)
                  print('packed', f, z.getinfo(f).file_size)
          PY
          ls -la sheng-boot-only.zip

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          tag="${{ github.event.inputs.tag }}"
          files=$(find . -maxdepth 1 -type f)
          if [ -z "$files" ]; then
            echo "::error::no files found to publish"
            exit 1
          fi
          echo "uploading files: $files"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && gh release delete "$tag" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "$tag" $files \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ github.event.inputs.artifact }} (run ${{ github.event.inputs.run_id }})" \
            --notes "Auto-published from actions run ${{ github.event.inputs.run_id }}, artifact '${{ github.event.inputs.artifact }}' (GKI v9 build: vendor_boot / 12GB memory-map / board v4 patches). Flash: fastboot flash boot_a boot.img && fastboot flash vendor_boot_a vendor_boot.img. Do NOT touch userdata."

      - name: Report asset URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.event.inputs.tag }}" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | .name + " -> " + .url'
