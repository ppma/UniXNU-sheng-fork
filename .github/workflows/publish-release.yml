name: Publish image to Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Source run id containing sheng-macos-27 artifact
        type: string
        required: true
        default: '44220867849'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h /
      - name: Download artifact and publish as Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euxo pipefail
          # 取 artifact 的下载 URL（GitHub 内部 API）
          URL=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name=="sheng-macos-27") | .archive_download_url')
          test -n "$URL"
          echo "Downloading artifact inside GitHub network..."
          curl -fL --retry 5 --retry-delay 5 -H "Authorization: Bearer $GH_TOKEN" "$URL" -o sheng-macos-27.zip
          ls -lh sheng-macos-27.zip
          # 校验是有效 zip
          unzip -t sheng-macos-27.zip > /dev/null
          # 创建/更新 Release 并上传（GitHub 内部，秒级）
          if ! gh release view sheng-macos-27 >/dev/null 2>&1; then
            gh release create sheng-macos-27 --title "sheng macOS 27.3 (26C5035r)" \
              --notes "Built by UniXNU macos-lab.yml. chipid 5a023ebb. Use thunder/xunlei or any download accelerator."
          fi
          gh release upload sheng-macos-27 sheng-macos-27.zip --clobber
          echo "=== PUBLIC DOWNLOAD URL ==="
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/sheng-macos-27/sheng-macos-27.zip"
