name: patch-vendor-boot-datareset

on:
  workflow_dispatch:

jobs:
  build-reader:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout device repo
        uses: actions/checkout@v4

      - name: Download kernel, busybox and deb
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, urllib.request
          req = urllib.request.Request('https://api.github.com/repos/ianchb/sm8550-mainline/releases?per_page=5',
                                       headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'wb-lr'})
          rels = json.loads(urllib.request.urlopen(req, timeout=120).read())
          rel = next(r for r in rels if r['tag_name'].startswith('7.3.4'))
          print('using tag:', rel['tag_name'])
          assets = {a['name']: a['browser_download_url'] for a in rel['assets']}
          print('assets:', list(assets))
          for name in ('boot_sheng_singleboot.img', 'linux-xiaomi-sheng.deb'):
              with urllib.request.urlopen(assets[name], timeout=600) as r, open(name, 'wb') as f:
                  f.write(r.read())
              print('downloaded', name)
          PY
          ls -la boot_sheng_singleboot.img linux-xiaomi-sheng.deb
          for u in \
            "https://dl-cdn.alpinelinux.org/alpine/v3.21/main/aarch64/busybox-static-1.36.1-r29.apk" \
            "https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/busybox-static-1.36.1-r29.apk" \
            "https://dl-cdn.alpinelinux.org/alpine/v3.19/main/aarch64/busybox-static-1.36.1-r29.apk" \
            "https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/busybox-static-1.36.1-r28.apk" \
            "https://dl-cdn.alpinelinux.org/alpine/v3.19/main/aarch64/busybox-static-1.36.1-r28.apk"; do
            echo "try $u"
            curl -sfL --retry 2 -o bs.apk "$u" && break
          done
          tar -xzf bs.apk bin/busybox.static
          mv bin/busybox.static busybox
          chmod +x busybox
          ls -la busybox

      - name: Extract tools from deb
        run: |
          set -euxo pipefail
          dpkg-deb -x linux-xiaomi-sheng.deb rootfs
          find rootfs -name 'rebootbl' | head -5
          find rootfs -name 'nvmem-reboot-mode.ko' | head -5

      - name: Build log reader image
        run: |
          set -euxo pipefail
          python3 package/linux-log/build-linux-log-boot.py \
            --boot boot_sheng_singleboot.img \
            --busybox busybox \
            --rebootbl "$(find rootfs -name rebootbl -type f | head -1)" \
            --module "$(find rootfs -name nvmem-reboot-mode.ko -type f | head -1)" \
            --out sheng-linux-log.img
          ls -la sheng-linux-log.img

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release view gki-tools --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release delete gki-tools --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create gki-tools sheng-linux-log.img --repo "$GITHUB_REPOSITORY" --title "diagnostic tools" --notes "sheng-linux-log.img: flash to boot_a, boots a tiny Linux that enumerates a USB CDC ACM serial and serves the UniXNU log window (last 32MiB of userdata). Flash back the normal boot image afterwards."
