name: patch-vendor-boot-datareset

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact via API (GitHub-internal transfer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ART=15079403875
          curl -sL --retry 6 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ART/zip" \
            -o sheng-boot-only.zip
          ls -la sheng-boot-only.zip
          unzip -q -o sheng-boot-only.zip
          find . -maxdepth 2 -type f -printf '%s  %p\n' | sort -nr | head -15

      - name: Publish v15 boot.img to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release view gki-v15 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release delete gki-v15 --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          BOOT=$(find . -maxdepth 2 -type f -name 'boot.img' ! -path './sheng-boot-only*' | head -1)
          VB=$(find . -maxdepth 2 -type f -name 'vendor_boot.img' ! -path './sheng-boot-only*' | head -1)
          gh release create gki-v15 "$BOOT" "$VB" --repo "$GITHUB_REPOSITORY" \
            --title "v15: ResetSystemLib fix (macOS restart goes to system)" \
            --notes "run 45730799220. boot.img maps every reset to plain PSCI SYSTEM_RESET (stock warm path used SYSTEM_RESET2 which Qualcomm XBL maps to fastboot). vendor_boot unchanged from v11. Flash: fastboot flash boot_a boot.img"
          gh release view gki-v15 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | .name + " (" + (.size|tostring) + ")"'
