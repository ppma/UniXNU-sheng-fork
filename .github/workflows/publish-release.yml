name: patch-vendor-boot-datareset

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact via API (GitHub-internal transfer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ART=15047563104
          curl -sL --retry 6 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ART/zip" \
            -o sheng-boot-only.zip
          ls -la sheng-boot-only.zip
          unzip -q -o sheng-boot-only.zip
          find . -maxdepth 2 -type f -printf '%s  %p\n' | sort -nr | head -15

      - name: Publish v12 boot.img to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release view gki-v12 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release delete gki-v12 --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          BOOT=$(find . -maxdepth 2 -type f -name 'boot.img' ! -path './sheng-boot-only*' | head -1)
          VB=$(find . -maxdepth 2 -type f -name 'vendor_boot.img' ! -path './sheng-boot-only*' | head -1)
          gh release create gki-v12 "$BOOT" "$VB" --repo "$GITHUB_REPOSITORY" \
            --title "v12: full 12GiB memory map" \
            --notes "run 45652736259. boot.img keeps the complete 12 GiB DRAM in the UEFI memory map (v11 clipped the top 4 GiB at 0xa00000000, macOS saw ~7 GiB). vendor_boot unchanged from v11. Flash: fastboot flash boot_a boot.img"
          gh release view gki-v12 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | .name + " (" + (.size|tostring) + ")"'
