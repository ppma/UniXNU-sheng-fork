name: patch-vendor-boot-datareset

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build TianoCompress and fetch scripts
        run: |
          set -euxo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq mtools
          git clone --depth 1 --filter=blob:none --sparse https://github.com/microsoft/mu_basecore.git mubt
          git -C mubt sparse-checkout set BaseTools/Source/C BaseTools/Source/Python MdePkg/Include
          make -C mubt/BaseTools/Source/C TianoCompress 2>/dev/null || make -C mubt/BaseTools/Source/C || true
          TC=$(find mubt -name TianoCompress -type f | head -1)
          if [ -z "$TC" ]; then echo "::error::TianoCompress build failed"; exit 1; fi
          sudo ln -sf "$(pwd)/$TC" /usr/local/bin/TianoCompress
          TianoCompress --version || true
          REF=8542980d02b4d2cc5c32ee3542de1760b2562aac
          mkdir -p unixnu
          curl -sL "https://raw.githubusercontent.com/UniXNU/UniXNU/$REF/scripts/unixnu/ramdisk.py" -o ramdisk.py
          curl -sL "https://raw.githubusercontent.com/UniXNU/UniXNU/$REF/scripts/unixnu/vendor_boot.py" -o unixnu/vendor_boot.py
          curl -sL "https://raw.githubusercontent.com/UniXNU/UniXNU/$REF/scripts/unixnu/util.py" -o unixnu/util.py
          touch unixnu/__init__.py

      - name: Download v9 vendor_boot from release
        run: |
          set -euxo pipefail
          curl -sL --retry 5 --retry-all-errors -o stock-vendor_boot.img "https://github.com/ppma/UniXNU-sheng-fork/releases/download/gki-v9-build/vendor_boot.img"
          ls -la stock-vendor_boot.img

      - name: Write patch scripts
        run: |
          cat > patch_vb.py <<'PYEOF'
          import os, sys, subprocess
          sys.path.insert(0, '.')
          import ramdisk
          from unixnu import vendor_boot

          stock = open('stock-vendor_boot.img', 'rb').read()
          parts = vendor_boot.parse(stock)
          open('ramdisk.bin', 'wb').write(parts['ramdisk'])
          print('vendor ramdisk bytes:', len(parts['ramdisk']))

          ramdisk.decode('ramdisk.bin', 'fat.img')
          print('FAT bytes:', os.path.getsize('fat.img'))
          assert os.path.getsize('fat.img') == 256 * 1024 * 1024

          def run(cmd, required=True):
              r = subprocess.run(cmd, capture_output=True, text=True)
              print('$', ' '.join(cmd), 'rc=', r.returncode)
              if r.stdout:
                  print(r.stdout[:2000])
              if r.stderr:
                  print('ERR:', r.stderr[:300])
              if required and r.returncode != 0:
                  sys.exit(1)
              return r

          run(['mdir', '-i', 'fat.img', '::/'], required=False)
          import re
          du = run(['mdu', '-i', 'fat.img', '::'], required=False)
          tomls = re.findall(r'(::/[^\s]*unixnu\.toml)', du.stdout)
          print('toml paths:', tomls)
          toml_path = tomls[0] if tomls else None
          if not toml_path:
              print('::error::unixnu.toml not located')
              sys.exit(1)
          print('using toml path:', toml_path)
          run(['mcopy', '-i', 'fat.img', toml_path, 'u.toml'])
          text = open('u.toml', 'rb').read()
          print('toml bytes:', len(text))
          print(text.decode('utf-8', 'replace')[:800])
          if b'ethernet=1' not in text:
              print('::error::ethernet=1 not found in unixnu.toml')
              sys.exit(1)
          count = text.count(b'ethernet=1')
          text = text.replace(b'ethernet=1', b'data-reset=1')
          open('u.toml', 'wb').write(text)
          print('replaced occurrences:', count)
          subprocess.run(['mcopy', '-i', 'fat.img', '-o', 'u.toml', toml_path], check=True)

          ramdisk.encode('fat.img', 'new-ramdisk.bin')
          vendor_boot.build('stock-vendor_boot.img', 'new-ramdisk.bin', 'vendor_boot-patched.img', 0x1000000)
          print('patched size:', os.path.getsize('vendor_boot-patched.img'))
          assert os.path.getsize('vendor_boot-patched.img') <= 0x6000000
          print('PATCH DONE')
          PYEOF
          cat > verify_vb.py <<'PYEOF'
          import struct
          v = open('vendor_boot-patched.img', 'rb').read()
          assert v[:8] == b'VNDRBOOT'
          hver, page = struct.unpack_from('<II', v, 8)
          raddr = struct.unpack_from('<I', v, 20)[0]
          vrs = struct.unpack_from('<I', v, 24)[0]
          print('header_version=%d page=%d vendor_ramdisk_size=%d ramdisk_addr=0x%x' % (hver, page, vrs, raddr))
          assert hver == 4 and page == 4096 and vrs > 0 and raddr == 0x1000000
          assert len(v) <= 0x6000000
          print('VERIFY OK')
          PYEOF

      - name: Decode patch encode rebuild
        run: |
          set -euxo pipefail
          python3 patch_vb.py
          ls -la vendor_boot-patched.img new-ramdisk.bin

      - name: Verify patched image headers
        run: |
          python3 verify_vb.py

      - name: Publish patched vendor_boot to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release view gki-v9-datareset --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release delete gki-v9-datareset --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create gki-v9-datareset vendor_boot-patched.img --repo "$GITHUB_REPOSITORY" --title "vendor_boot with data-reset=1 (patched v9)" --notes "v9 vendor_boot.img with default-boot kernel arg ethernet=1 replaced by data-reset=1 (same length). Flash: fastboot flash vendor_boot_a vendor_boot-patched.img"
          gh release view gki-v9-datareset --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | .name + " -> " + .url'
