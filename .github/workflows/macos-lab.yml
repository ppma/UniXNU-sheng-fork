name: sheng macOS lab

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: UniXNU core branch or commit
        type: string
        default: 8542980d02b4d2cc5c32ee3542de1760b2562aac
      root_storage:
        description: Build the userdata root image
        type: boolean
        default: true
      export_build_inputs:
        description: Export cached XNU objects and the SDK for a local build
        type: boolean
        default: false
      kernel_cache_key:
        description: Kernel cache to export
        type: string
        default: sheng-macos27-kernel-v1-d509f7e4757a27f5-43684813634

permissions:
  contents: read

concurrency:
  group: macos-lab-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  local-inputs:
    if: inputs.export_build_inputs
    uses: ./.github/workflows/export-kernel-cache.yml
    with:
      cache_key: ${{ inputs.kernel_cache_key }}
  images:
    if: ${{ !inputs.export_build_inputs }}
    runs-on: macos-26-intel
    timeout-minutes: 360
    env:
      UNIXNU_IPSW_JOBS: 16
      HOMEBREW_NO_AUTO_UPDATE: 1
      GITHUB_TOKEN: ${{ github.token }}
      UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
      UNIXNU_LAB_PASSWORD: ${{ secrets.UNIXNU_LAB_PASSWORD }}
    steps:
      - name: Log runner environment
        run: |
          set -eu
          echo "arch=$(uname -m) | brew=$(brew --prefix) | macOS=$(sw_vers -productVersion)"
          echo "Homebrew API mode will be forced in Install build tools"
      - name: Select full Xcode toolchain
        run: |
          set -eu
          if [ -d /Applications/Xcode_26.6.app/Contents/Developer ]; then
            cand=/Applications/Xcode_26.6.app/Contents/Developer
          else
            cand=$(ls -d /Applications/Xcode*.app/Contents/Developer 2>/dev/null | sort | tail -1)
          fi
          if [ -z "$cand" ]; then
            echo "::error::No full Xcode.app found on this runner; available /Applications:"
            ls /Applications
            exit 1
          fi
          echo "DEVELOPER_DIR=$cand" >> "$GITHUB_ENV"
          echo "Selected DEVELOPER_DIR=$cand"
          DEVELOPER_DIR="$cand" xcodebuild -version
          DEVELOPER_DIR="$cand" xcrun --sdk iphoneos --show-sdk-version
      - name: Check out device sources
        uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - name: Check out core sources
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ inputs.core_ref }}
          path: UniXNU
          submodules: recursive
      - name: Apply PR 318 (AppleCredentialManager in prelink)
        # Upstream open PR UniXNU/UniXNU#318: without AppleCredentialManager the
        # macOS GUI authorization path (coreauthd/coreautha) fails ACMContextCreate
        # with -5 and every password prompt shakes and rejects valid input.
        # acm_fastsim=1 (board side) selects Apple's software command dispatcher.
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('UniXNU/profiles/os/macos-27.3-26C5035r/profile.toml')
          s = p.read_text()
          old1 = '"com.apple.driver.AppleAudioClockLibs", "com.apple.driver.AppleEffaceableStorage"'
          new1 = '"com.apple.driver.AppleAudioClockLibs", "com.apple.driver.AppleCredentialManager", "com.apple.driver.AppleEffaceableStorage"'
          assert old1 in s, 'roots anchor 1 missing'
          s = s.replace(old1, new1)
          old2 = '"!com.apple.driver.AppleOnboardSerial", "!com.apple.driver.AppleSMC"]'
          new2 = '"!com.apple.driver.AppleOnboardSerial", "!com.apple.driver.AppleSMC", "!com.apple.driver.AppleSEPManager", "!com.apple.driver.IOSlaveProcessor"]'
          assert old2 in s, 'roots anchor 2 missing'
          s = s.replace(old2, new2)
          p.write_text(s, newline='\n')
          c = Path('UniXNU/components.toml')
          t = c.read_text()
          old3 = 'os_abi = ["ipados-17.7.11-21H461", "ipados-27.0.1-24A446"]'
          new3 = 'os_abi = ["ipados-17.7.11-21H461", "ipados-27.0.1-24A446", "macos-27.3-26C5035r"]'
          assert old3 in t, 'os_abi anchor missing'
          c.write_text(t.replace(old3, new3), newline='\n')
          print('PR 318 patches applied')
          PY
      - name: Check out firmware sources
        uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: b303410c8e401fc9419ae65a024356ed09a438ef
          path: uefi-sheng
          submodules: false
      - name: Apply validated GKI + 12GB firmware patches
        run: |
          set -euxo pipefail
          curl -fsSL --retry 5 -o stock-vendor_boot-306.img \
            https://github.com/ppma/UniXNU-sheng-fork/releases/download/sheng-macos-27/stock-vendor_boot-306.img
          cp stock-vendor_boot-306.img device/stock-vendor_boot-306.img
          echo '' | base64 -d > /tmp/bootimg-vendor.diff
          echo '' | base64 -d > /tmp/patch-board.py
          echo '' | base64 -d > /tmp/patch-mm.py
          cd UniXNU && git apply /tmp/bootimg-vendor.diff && echo 'bootimg.py patched'
          cd ../device && python3 /tmp/patch-board.py
          cd ../uefi-sheng && python3 /tmp/patch-mm.py
          mkdir -p Platforms/Xiaomi/shengPkg/Library/ShengResetSystemLib
                    echo '' | base64 -d > Platforms/Xiaomi/shengPkg/Library/ShengResetSystemLib/ShengResetSystemLib.c
                    echo '' | base64 -d > Platforms/Xiaomi/shengPkg/Library/ShengResetSystemLib/ShengResetSystemLib.inf
                    echo '' | base64 -d > /tmp/patch-reset.py
                    python3 /tmp/patch-reset.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Restore build inputs
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          key: sheng-macos27-build-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: sheng-macos27-build-v1-${{ runner.os }}-
          path: |
            UniXNU/out/feeds
            !UniXNU/out/feeds/*/BaseTools/Source/C/bin
            !UniXNU/out/feeds/*/BaseTools/Source/C/bin/*
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/gpu-reference
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/mesa-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/adreno-metal-bridge
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/m2v-target
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/mesa-tu-macos27
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime/data.dbr
            device/drivers/Ath12kWifi/deps
            device/.cache/firmware
      - name: Refresh pinned translator checkout
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, shutil, subprocess
          from pathlib import Path
          core = Path('UniXNU')
          pin = json.loads((core / 'scripts/data/gpu-metal-vulkan-inputs.json').read_text())['translator']['commit']
          source = core / 'out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/gpu-reference/metal2vulkan'
          signature = hashlib.sha256((pin + '\n').encode() + (core / 'scripts/build-adreno-metal-bridge.py').read_bytes() + b''.join(path.read_bytes() for path in sorted((core / 'drivers/AdrenoMetal/bridge/patches').glob('*.patch')))).hexdigest()
          stamp = source.with_name('unixnu-translator-patch.sha256')
          if source.exists():
              actual = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip()
              if actual != pin or not stamp.exists() or stamp.read_text().strip() != signature:
                  shutil.rmtree(source)
          stamp.parent.mkdir(parents=True, exist_ok=True)
          stamp.write_text(signature + '\n')
          PYTHON
      - name: Install build tools
        timeout-minutes: 45
        run: |
          export HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_ANALYTICS=1
          # Intel runner images set HOMEBREW_NO_INSTALL_FROM_API=1, which makes brew
          # fetch individual .rb files from raw.githubusercontent.com and hang.
          # Unset it so brew uses the formulae.brew.sh API (one JSON download).
          unset HOMEBREW_NO_INSTALL_FROM_API
          export HOMEBREW_API_DOMAIN=https://formulae.brew.sh
          echo "HOMEBREW_NO_INSTALL_FROM_API='${HOMEBREW_NO_INSTALL_FROM_API:-<unset>}' brew=$(brew --prefix)"
          # Intentionally NO brew update: keep the image's complete local taps intact.
          for p in dtc llvm lld llvm@22 lld@22 cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup unifdef openssl@3 zstd ipsw; do
            echo "::group::brew install $p"
            if brew list --versions "$p" >/dev/null 2>&1; then
              echo "already installed: $p"
            else
              brew install "$p" || { echo "::error::brew install $p failed"; exit 1; }
            fi
            echo "::endgroup::"
          done
          # Homebrew llvm/llvm@22 are keg-only (bin not linked into the prefix bin).
          # build-adreno-metal-bridge.py hardcodes /opt/homebrew/opt/llvm/bin/llvm-as
          # (arm64 only) and otherwise falls back to shutil.which('llvm-as').
          # On the Intel runner expose the real llvm-as (LLVM 22) via GITHUB_PATH.
          llvm_as="$(brew --prefix)/opt/llvm@22/bin/llvm-as"
          if [ ! -x "$llvm_as" ]; then
            llvm_as="$(brew --prefix)/opt/llvm/bin/llvm-as"
          fi
          if [ ! -x "$llvm_as" ]; then
            echo "::error::llvm-as (LLVM >= 21) not found under $(brew --prefix)/opt"; exit 1
          fi
          echo "llvm-as: $llvm_as -> $("$llvm_as" --version | head -1)"
          {
            echo "$(dirname "$llvm_as")"
            echo "$HOME/.cargo/bin"
            echo "$(brew --prefix)/opt/bison/bin"
          } >> "$GITHUB_PATH"
          python3 - <<'PYTHON'
          import os, subprocess
          from pathlib import Path
          prefix = Path(subprocess.check_output(['brew', '--prefix'], text=True).strip())
          toolchain = Path('uefi-toolchain').resolve()
          toolchain.mkdir()
          for name in ('clang', 'llvm-lib', 'llvm-rc', 'lld-link'):
              package = 'lld@22' if name == 'lld-link' else 'llvm@22'
              (toolchain / name).symlink_to(prefix / 'opt' / package / 'bin' / name)
          with Path(__import__('os').environ['GITHUB_ENV']).open('a') as output:
              output.write('CLANG_BIN=' + str(toolchain) + '/\n')
          PYTHON
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Identify kernel SDK cache
        id: kernel-sdk
        run: |
          python3 - <<'PYTHON'
          import hashlib, os, subprocess
          from pathlib import Path
          version = subprocess.check_output(['xcodebuild', '-version']) + subprocess.check_output(['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'])
          key = 'sheng-macos27-kernel-v1-' + hashlib.sha256(version).hexdigest()[:16]
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('key=' + key + '\n')
          PYTHON
      - name: Restore kernel compile records
        id: kernel-cache
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.kernel-sdk.outputs.key }}-${{ github.run_id }}
          restore-keys: ${{ steps.kernel-sdk.outputs.key }}-
          path: |
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/xnu-inputs.json
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/xnu-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/fakeroot
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/xnu
      - name: Pre-seed locked wifi sources
        # freebsd-src releng 分支 tip 会前进，导致 fetch-sources.py 深克隆校验失败；
        # 这里按锁文件精确预置锁定 commit 的仓库，绕开分支漂移
        run: |
          python3 - <<'PYTHON'
          import json, subprocess
          from pathlib import Path
          root = Path('device/drivers/Ath12kWifi')
          lock = json.loads((root / 'tools/source-lock.json').read_text())
          source = lock['freebsd']
          directory = root / 'deps' / 'freebsd'
          if directory.exists():
              print('freebsd deps already present, skip')
          else:
              directory.parent.mkdir(parents=True, exist_ok=True)
              # 与 fetch-sources.py 的克隆方式一致（sparse+partial），但把 HEAD 固定到锁定 commit
              subprocess.run(['git', 'clone', '--depth', '1', '--branch', source['ref'],
                              '--filter=blob:none', '--sparse', source['url'], str(directory)], check=True)
              subprocess.run(['git', '-C', str(directory), 'fetch', '--depth', '1', 'origin', source['commit']], check=True)
              subprocess.run(['git', '-C', str(directory), 'checkout', source['commit']], check=True)
              print('freebsd seeded at', source['commit'][:12])
          PYTHON
      - name: Prepare installation
        working-directory: UniXNU
        run: |
          ./unixnu defconfig sheng_macos_defconfig -D ../device --os macos-27
          ./unixnu fetch --os macos-27
          if [ '${{ inputs.root_storage }}' = true ]; then
            python3 ../device/scripts/prepare-macos-install.py
          else
            python3 ../device/scripts/prepare-macos-install.py --reuse-policies
          fi
      - name: Rebuild EDK2 host tools natively
        # v8 compiled kernel.macho + prelink successfully, then package/build.sh
        # died: "BaseTools/Source/C/bin/GenFw: Bad CPU type in executable".
        # build-inputs cache (key has no CPU arch) restored arm64 EDK2 C tools
        # from run 44220867849. v9 excludes that bin dir from the cache, rebuilds
        # the C tools for the host arch, and fails fast if any arm64-only tool
        # remains (instead of finding out 50 min later at the package step).
        run: |
          set -euxo pipefail
          echo "host arch: $(uname -m)"
          python3 - <<'PY'
          import os, struct, subprocess, sys
          from pathlib import Path
          ARM64_32, ARM64, X86_64 = 0x0000000c, 0x0100000c, 0x01000007
          def cpu(p):
              try:
                  with Path(p).open('rb') as f:
                      h = f.read(8)
              except OSError:
                  return None
              if len(h) < 8:
                  return None
              if h[:4] in (b'\xcf\xfa\xed\xfe', b'\xce\xfa\xed\xfe'):
                  return struct.unpack('<I', h[4:8])[0]
              return None
          roots = sorted(Path('UniXNU/out/feeds').glob('*/BaseTools'))
          print('BaseTools roots:', [str(r) for r in roots])
          if not roots:
              print('::error::no EDK2 BaseTools tree found')
              sys.exit(1)
          jobs = str(os.cpu_count() or 4)
          for r in roots:
              bindir = r / 'Source' / 'C' / 'bin'
              genfw = bindir / 'GenFw'
              c = cpu(genfw) if genfw.exists() else None
              print('%s GenFw cpu=%s' % (genfw, hex(c) if c else 'missing/fat/script'))
              if genfw.exists() and c == X86_64:
                  print('  already native x86_64, skip rebuild')
                  continue
              print('  rebuilding native EDK2 C tools')
              if genfw.exists():
                  genfw.unlink()
              cmds = [['make', '-C', str(r / 'Source' / 'C'), '-j', jobs],
                      ['make', '-C', str(r), '-j', jobs]]
              ok = False
              for cmd in cmds:
                  print('  try: ' + ' '.join(cmd))
                  rc = subprocess.call(cmd)
                  if rc == 0 and genfw.exists():
                      ok = True
                      break
                  print('  rc=%d' % rc)
              if not ok:
                  print('::error::failed to rebuild ' + str(genfw))
                  sys.exit(1)
          bad = []
          for r in roots:
              bindir = r / 'Source' / 'C' / 'bin'
              if not bindir.is_dir():
                  continue
              for p in bindir.iterdir():
                  if not p.is_file() or p.is_symlink():
                      continue
                  if cpu(p) in (ARM64, ARM64_32):
                      bad.append(str(p))
          print('arm64-only host tools remaining: %d' % len(bad))
          for x in bad[:20]:
              print('  ' + x)
          if bad:
              print('::error::arm64-only EDK2 host tools would fail at package stage')
              sys.exit(1)
          print('EDK2 host tools native OK')
          PY
      - name: Build images
        id: build-images
        working-directory: device
        run: scripts/package.sh --os macos-27 --uefi ../uefi-sheng
      - name: Publish shader inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shader-inventory
          path: |
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/prime-list.txt
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/prime-list.json
          retention-days: 1
      - name: Build root storage
        if: inputs.root_storage
        working-directory: UniXNU
        run: |
          python3 - <<'PY'
          import subprocess, sys
          sys.path.insert(0, 'scripts')
          from unixnu.cli import parser
          from unixnu.config import Context
          ctx = Context(parser().parse_args(['build', 'userdata', '-D', '../device', '--os', 'macos-27']))
          objects = []
          for window in ctx.board['userdata']['windows']:
              name = window['name']
              objects += ['--object', f'{name}.vroot={ctx.tree}/build/verified-root-{name}/hashes.bin']
          subprocess.run(['./unixnu', 'build', 'userdata', '--os', 'macos-27', *objects], check=True)
          PY
      - name: Stage device artifacts
        env:
          BUILD_ROOT_STORAGE: ${{ inputs.root_storage }}
        run: |
          mkdir artifacts
          target=UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos
          cp "$target/boot/boot.img" "$target/payload/payload.img" "$target/kernel/kernel.macho" "$target/package.manifest.json" artifacts/
          if [ -f "$target/boot/vendor_boot.img" ]; then cp "$target/boot/vendor_boot.img" artifacts/; fi
          cp "$target/runtime/data.dbr" artifacts/
          cp "$target/tree/build/prime-list.txt" "$target/tree/build/prime-list.json" artifacts/
          if [ "$BUILD_ROOT_STORAGE" = true ]; then
            cp "$target/userdata/userdata-root.json" artifacts/
            zstd -T0 -3 --sparse "$target/userdata/userdata-root.img" -o artifacts/userdata-root.img.zst
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sheng-macos-27
          path: artifacts/
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: sheng-boot-only
          if-no-files-found: warn
          compression-level: 0
          retention-days: 3
          path: |
            artifacts/boot.img
            artifacts/vendor_boot.img
            artifacts/payload.img
            artifacts/kernel.macho
            artifacts/data.dbr
            artifacts/package.manifest.json
            artifacts/prime-list.txt
            artifacts/prime-list.json
            artifacts/userdata-root.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            UniXNU/out/sheng/*/*/logs/*.log
            UniXNU/out/sheng/*/*/tree/build/adreno-metal-bridge/build-*.log
            UniXNU/out/sheng/*/*/tree/build/prime-list.*
            UniXNU/out/sheng/*/*/tree/build/sheng-source-storage/*.log
            UniXNU/out/sheng/*/*/tree/build/sheng-source-storage/*.command.json
          retention-days: 1
      - name: Save build inputs
        if: always() && steps.build-images.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: sheng-macos27-build-v1-${{ runner.os }}-${{ github.run_id }}
          path: |
            UniXNU/out/feeds
            !UniXNU/out/feeds/*/BaseTools/Source/C/bin
            !UniXNU/out/feeds/*/BaseTools/Source/C/bin/*
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/gpu-reference
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/mesa-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/adreno-metal-bridge
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/m2v-target
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/mesa-tu-macos27
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime/data.dbr
            device/drivers/Ath12kWifi/deps
            device/.cache/firmware
      - name: Upload kernel build inputs
        if: always() && steps.build-images.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-inputs
          retention-days: 7
          compression-level: 0
          path: |
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/xnu-inputs.json
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/xnu-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/fakeroot
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/xnu
            UniXNU/out/feeds
            device/drivers/Ath12kWifi/deps
            device/.cache/firmware
      - name: Save kernel compile records
        if: always() && steps.build-images.outcome == 'success' && steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.kernel-sdk.outputs.key }}-${{ github.run_id }}
          path: |
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/xnu-inputs.json
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/xnu-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/fakeroot
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/xnu
